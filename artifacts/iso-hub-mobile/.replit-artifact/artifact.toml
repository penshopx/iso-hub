kind = "mobile"
previewPath = "/iso-hub-mobile/"
title = "ISO Hub Mobile"
version = "1.0.0"
id = "artifacts/iso-hub-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/iso-hub-mobile/" ]
localPort = 21515

[services.development]
run = "pnpm --filter @workspace/iso-hub-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iso-hub-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/iso-hub-mobile", "run", "serve" ]

[services.env]
PORT = "21515"
BASE_PATH = "/iso-hub-mobile/"
