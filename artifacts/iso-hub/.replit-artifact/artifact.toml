kind = "web"
previewPath = "/"
title = "ISO Hub"
version = "1.0.0"
id = "artifacts/iso-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20537

[services.development]
run = "pnpm --filter @workspace/iso-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iso-hub", "run", "build" ]
publicDir = "artifacts/iso-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20537"
BASE_PATH = "/"
