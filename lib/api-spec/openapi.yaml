openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Notifications
    description: Mobile push notification registration.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLogoutRequest'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /v1/notifications/push-token:
    post:
      tags: [Notifications]
      operationId: registerPushToken
      summary: Register an Expo push token for the authenticated mobile user
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRegistration'
      responses:
        '200':
          description: Push token registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTokenRegistrationSuccess'
        '400':
          description: Invalid push token or platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/projects:
    get:
      tags: [Projects]
      operationId: getProjects
      summary: List ISO Hub consulting projects and saved readiness
      security:
        - SessionBearer: []
        - BrowserSession: []
      responses:
        '200':
          description: Projects with their internal readiness state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create an ISO Hub consulting project
      security:
        - SessionBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Invalid project fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/projects/{projectId}/readiness:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Projects]
      operationId: getProjectReadiness
      summary: Get a project's saved ISO Hub readiness assessment
      security:
        - SessionBearer: []
        - BrowserSession: []
      responses:
        '200':
          description: Saved assessment or null when not started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessEnvelope'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Projects]
      operationId: saveProjectReadiness
      summary: Save or update a project's ISO Hub readiness assessment
      security:
        - SessionBearer: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveReadinessRequest'
      responses:
        '200':
          description: Assessment saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessRecordEnvelope'
        '400':
          description: Invalid assessment fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      description: Opaque mobile session token.
    BrowserSession:
      type: apiKey
      in: cookie
      name: sid
      description: Browser session cookie.
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    MobileLogoutRequest:
      type: object
      properties:
        pushToken:
          type: [string, 'null']
          description: Expo push token registered by this app installation.
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    PushTokenRegistration:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 1
          description: ExpoPushToken or ExponentPushToken value.
        platform:
          type: string
          enum: [ios, android]
        deviceId:
          type: string
          maxLength: 200
    PushTokenRegistrationSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    Readiness:
      type: object
      required: [id, projectId, needType, selectedStandards, checkedItems, updatedAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        needType:
          type: string
          enum: [tender, proyek, audit]
        selectedStandards:
          type: array
          items:
            type: string
        checkedItems:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    Project:
      type: object
      required: [id, name, client, isoStandard, readiness]
      properties:
        id:
          type: integer
        name:
          type: string
        client:
          type: string
        isoStandard:
          type: string
        description:
          type: [string, 'null']
        status:
          type: [string, 'null']
        progress:
          type: [integer, 'null']
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
        readiness:
          oneOf:
            - $ref: '#/components/schemas/Readiness'
            - type: 'null'
    ProjectsEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    ProjectEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Project'
    ReadinessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          oneOf:
            - $ref: '#/components/schemas/Readiness'
            - type: 'null'
    ReadinessRecordEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Readiness'
    CreateProjectRequest:
      type: object
      required: [name, client, isoStandard]
      properties:
        name:
          type: string
          minLength: 1
        client:
          type: string
          minLength: 1
        isoStandard:
          type: string
          minLength: 1
        description:
          type: string
    SaveReadinessRequest:
      type: object
      required: [needType, selectedStandards, checkedItems]
      properties:
        needType:
          type: string
          enum: [tender, proyek, audit]
        selectedStandards:
          type: array
          items:
            type: string
        checkedItems:
          type: array
          items:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

